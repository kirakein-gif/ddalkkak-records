name: Patch transfer sorting and print details
on:
  push:
    paths:
      - '.github/workflows/patch-transfer-sorting-print.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply feedback patch
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('site-src/transfer-v0.3.source.html')
          c=p.read_text(encoding='utf-8')

          def must(old,new,label):
              global c
              if old not in c:
                  raise SystemExit(f'anchor not found: {label}')
              c=c.replace(old,new,1)

          # Pull pages/actions left; highlight special records and single documents over 100 pages.
          must(
            ".docrow{grid-template-columns:64px 82px minmax(0,1fr) 74px 218px!important;min-height:46px!important;padding:6px 9px!important}",
            ".docrow{grid-template-columns:64px 82px minmax(300px,520px) 64px 205px!important;justify-content:start!important;min-height:46px!important;padding:6px 9px!important}",
            "binding grid"
          )
          must(
            ".docrow.volfirst{background:#fbfdff;border-top:1px solid #dbe6f5}",
            ".docrow.volfirst{background:#fbfdff;border-top:1px solid #dbe6f5}.docrow.special-row{background:#fff8e8!important;border-left:3px solid #f0b429}.docrow.oversize-row{background:#fff0ef!important;border-left:3px solid #d92d20}.rowflag{display:inline-flex;align-items:center;margin-left:5px;padding:1px 5px;border-radius:999px;font-size:9.5px;font-weight:900}.rowflag.special{background:#fff0c2;color:#8a5b00}.rowflag.over{background:#fee4e2;color:#b42318}",
            "binding highlights"
          )

          old_sort="""function titleVolumeSeq(title){const m=String(title||'').match(/\\((\\d+)\\s*-\\s*0*(\\d+)\\)/);return m?{total:Number(m[1]),index:Number(m[2])}:null}
          function refreshBindTaskSelect(){const s=$('taskSelect');if(!s)return;const ts=tasks(),cur=selectedTask;s.innerHTML='<option value="">과제카드 전체</option>';ts.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o)});if(ts.includes(cur))s.value=cur}
          function selectTaskFromDropdown(v){if(v)selectedTask=v;renderTaskList();renderBinding()}
          function taskDocs(t){return docs.filter(d=>d.taskCard===t).sort((a,b)=>{const am=Number.isFinite(Number(a.order)),bm=Number.isFinite(Number(b.order));if(am&&bm)return Number(a.order)-Number(b.order);if(am!==bm)return am?-1:1;const dc=String(a.date||'').localeCompare(String(b.date||''));if(dc)return dc;const av=titleVolumeSeq(a.title),bv=titleVolumeSeq(b.title);if(av&&bv&&av.total===bv.total&&av.index!==bv.index)return av.index-bv.index;return a.id-b.id})}"""
          new_sort="""function titleVolumeSeq(title){const m=String(title||'').match(/\\((\\d+)\\s*-\\s*0*(\\d+)\\)/);return m?{total:Number(m[1]),index:Number(m[2])}:null}
          function documentNoSeq(no){const s=String(no||'').trim(),m=s.match(/(\\d+)(?!.*\\d)/);return m?Number(m[1]):Number.MAX_SAFE_INTEGER}
          function hasManualOrder(d){return d.order!==null&&d.order!==undefined&&d.order!==''&&Number.isFinite(Number(d.order))}
          function refreshBindTaskSelect(){const s=$('taskSelect');if(!s)return;const ts=tasks(),cur=selectedTask;s.innerHTML='<option value="">과제카드 전체</option>';ts.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o)});if(ts.includes(cur))s.value=cur}
          function selectTaskFromDropdown(v){if(v)selectedTask=v;renderTaskList();renderBinding()}
          function taskDocs(t){return docs.filter(d=>d.taskCard===t).sort((a,b)=>{const am=hasManualOrder(a),bm=hasManualOrder(b);if(am&&bm)return Number(a.order)-Number(b.order);if(am!==bm)return am?-1:1;const dc=String(a.date||'').localeCompare(String(b.date||''));if(dc)return dc;const an=documentNoSeq(a.documentNo),bn=documentNoSeq(b.documentNo);if(an!==bn)return an-bn;const nc=String(a.documentNo||'').localeCompare(String(b.documentNo||''),'ko');if(nc)return nc;const av=titleVolumeSeq(a.title),bv=titleVolumeSeq(b.title);if(av&&bv&&av.total===bv.total&&av.index!==bv.index)return av.index-bv.index;return a.id-b.id})}"""
          must(old_sort,new_sort,"date documentNo sorting")

          # Highlight rows in binding.
          old_row="""body+='<div class="docrow '+(di===0?'volfirst ':'')+(d.excluded?'ex ':'')+(d.manualSplit?'splitline':'')+'" draggable="true" ondragstart="dragDocStart('+d.id+',event)" ondragend="dragDocEnd(event)" ondragover="event.preventDefault()" ondrop="dragDocDrop('+d.id+',event)">'
                  +'<div class="doclead">'+(di===0?'<span class="voltag">'+(vi+1)+'권</span>':'')+'<span class="draghandle">⋮⋮</span></div>'
                  +'<div class="dt">'+esc(d.date)+'</div>'
                  +'<div class="ttl"><b>'+esc(d.title)+'</b><div class="muted">'+esc(d.documentNo)+' · '+esc(d.detailType)+(di===0?' · <span class="volmeta">'+v.length+'문서 · '+vp+'쪽</span>':'')+'</div></div>'"""
          new_row="""const special=d.detailType!=='일반문서',over=Number(d.pages)>100;
                body+='<div class="docrow '+(di===0?'volfirst ':'')+(special?'special-row ':'')+(over?'oversize-row ':'')+(d.excluded?'ex ':'')+(d.manualSplit?'splitline':'')+'" draggable="true" ondragstart="dragDocStart('+d.id+',event)" ondragend="dragDocEnd(event)" ondragover="event.preventDefault()" ondrop="dragDocDrop('+d.id+',event)">'
                  +'<div class="doclead">'+(di===0?'<span class="voltag">'+(vi+1)+'권</span>':'')+'<span class="draghandle">⋮⋮</span></div>'
                  +'<div class="dt">'+esc(d.date)+'</div>'
                  +'<div class="ttl"><b>'+esc(d.title)+'</b><div class="muted">'+esc(d.documentNo)+' · '+esc(d.detailType)+(special?'<span class="rowflag special">특수기록</span>':'')+(over?'<span class="rowflag over">100쪽 초과</span>':'')+(di===0?' · <span class="volmeta">'+v.length+'문서 · '+vp+'쪽</span>':'')+'</div></div>'"""
          must(old_row,new_row,"row highlights")

          # Freeze only through the visible header row.
          must("ws.views=[{state:'frozen',ySplit:12}];",
               "ws.views=[{state:'frozen',ySplit:10,topLeftCell:'A11',activeCell:'A11'}];",
               "freeze pane")

          # Place handover and records manager side-by-side, with department below.
          old_info="const info=[['A6','B6','기관명','C6','E6',inst],['F6','G6','이관연도','H6','K6',ty],['A7','B7','처리부서','C7','E7',dep],['F7','G7','작성자(인계자)','H7','K7',handover],['A8','B8','학교 기록물관리자','C8','E8',manager],['F8','G8','이관 규모','H8','K8',folders.length+'권 · '+totalDocs+'문서 · '+totalPages+'쪽']];"
          new_info="const info=[['A6','B6','기관명','C6','E6',inst],['F6','G6','이관연도','H6','K6',ty],['A7','B7','작성자(인계자)','C7','E7',handover],['F7','G7','학교 기록물관리자','H7','K7',manager],['A8','B8','처리부서','C8','E8',dep],['F8','G8','이관 규모','H8','K8',folders.length+'권 · '+totalDocs+'문서 · '+totalPages+'쪽']];"
          must(old_info,new_info,"handover receiver placement")

          # Handoff formulas follow the new visible-cell positions.
          must("fv(\"='이관신청서'!$C$7\",dep)", "fv(\"='이관신청서'!$C$8\",dep)", "department handoff")
          must("fv(\"='이관신청서'!$H$7\",handover),fv(\"='이관신청서'!$C$8\",manager)",
               "fv(\"='이관신청서'!$C$7\",handover),fv(\"='이관신청서'!$H$7\",manager)",
               "person handoff")

          p.write_text(c,encoding='utf-8')
          js=c[c.rfind('<script>')+8:c.rfind('</script>')]
          Path('/tmp/transfer.js').write_text(js,encoding='utf-8')
      - name: Syntax check
        run: node --check /tmp/transfer.js
      - name: Commit patch
        run: |
          git config user.name "ddalkkak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-src/transfer-v0.3.source.html
          git commit -m "fix: sort binding by date and document number; improve review visibility" || exit 0
          git push
