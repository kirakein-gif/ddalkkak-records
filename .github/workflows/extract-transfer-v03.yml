name: Extract transfer v0.3 source
on:
  push:
    paths:
      - '.github/workflows/extract-transfer-v03.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract transfer v0.3 HTML
        shell: python
        run: |
          import base64, gzip, pathlib
          parts=[
            pathlib.Path('site-src/transfer-v0.3.part01.b64').read_text().strip(),
            pathlib.Path('site-src/transfer-v0.3.part02.b64').read_text().strip(),
          ]
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          pathlib.Path('site-src/transfer-v0.3.source.html').write_text(html, encoding='utf-8')
      - name: Commit extracted source
        run: |
          git config user.name "ddalkkak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-src/transfer-v0.3.source.html
          git commit -m "chore: extract transfer v0.3 source" || exit 0
          git push
