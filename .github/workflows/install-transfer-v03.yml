name: Install transfer v0.3 source
on:
  push:
    paths:
      - '.github/workflows/install-transfer-v03.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write transfer v0.3 source
        shell: python
        run: |
          import base64, gzip, pathlib
          b64 = """
"""
          html = gzip.decompress(base64.b64decode(''.join(b64.split()))).decode('utf-8')
          pathlib.Path('site-src/transfer-v0.3.source.html').write_text(html, encoding='utf-8')
      - name: Commit transfer v0.3
        run: |
          git config user.name "ddalkkak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-src/transfer-v0.3.source.html
          git commit -m "feat: install transfer v0.3 UX and output" || exit 0
          git push
