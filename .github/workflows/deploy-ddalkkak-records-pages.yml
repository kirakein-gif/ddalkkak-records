name: Deploy migration test to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site-src/**"
      - ".github/workflows/deploy-ddalkkak-records-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild migration HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat site-src/migration-v0.5.part*.b64 \
            | tr -d '\n\r ' \
            | base64 --decode \
            | gzip --decompress \
            > _site/index.html
          test "$(wc -c < _site/index.html)" -gt 70000
          grep -q "v0.5 · 매핑 편집기" _site/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
