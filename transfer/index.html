<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이관신청서 테스트</title>
<style>
body{font-family:"Malgun Gothic",Arial,sans-serif;background:#f4f7fb;color:#1f2937;margin:0;display:grid;place-items:center;min-height:100vh}
.box{background:#fff;border:1px solid #dfe5ec;border-radius:16px;padding:28px 32px;text-align:center;box-shadow:0 8px 30px rgba(16,24,40,.06)}
h1{font-size:20px;margin:0 0 10px}.muted{color:#667085;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="box"><h1>이관신청서 테스트</h1><div id="state" class="muted">테스트 화면을 불러오고 있습니다.</div></div>
<script>
(async()=>{
  const state=document.getElementById('state');
  try{
    const urls=["../site-src/transfer-v0.1.part01.b64","../site-src/transfer-v0.1.part02.b64","../site-src/transfer-v0.1.part03.b64"];
    const chunks=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(u+' · HTTP '+r.status);
      return (await r.text()).replace(/\s+/g,'');
    }));
    const bin=atob(chunks.join(''));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('최신 Edge 또는 Chrome을 사용해주세요.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes("기록물 이관신청 결재 검토")) throw new Error('배포 파일 검증에 실패했습니다.');
    document.open(); document.write(html); document.close();
  }catch(e){
    state.innerHTML='<b>화면을 불러오지 못했습니다.</b><br>'+String(e.message||e)+'<br><br>잠시 후 새로고침해주세요.';
  }
})();
</script>
</body>
</html>
