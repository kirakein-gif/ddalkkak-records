<div class="box"><h1>기록물대장관리 테스트</h1><div id="state" class="muted">테스트 화면을 불러오고 있습니다.</div></div>

    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('최신 Edge 또는 Chrome을 사용해주세요.');

    html=html.replace('</head>','<style id="ddalkkak-ui-override">'+ddalkkakCss+'</style></head>');
    if(!html.includes("딸깍 기록물관리 v0.6.2")) throw new Error('배포 파일 검증에 실패했습니다.');
    document.open(); document.write(html); document.close();
  }catch(e){
    state.innerHTML='<b>화면을 불러오지 못했습니다.</b><br>'+String(e.message||e)+'<br><br>잠시 후 새로고침해주세요.';
  }
})();
</script>
</body>
</html>
