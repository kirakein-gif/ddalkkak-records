<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>딸깍 기록물관리 · 보유기록물 관리</title>
<style>body{font-family:"Malgun Gothic",Arial,sans-serif;background:#f4f7fb;color:#1f2937;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #dfe5ec;border-radius:16px;padding:28px 32px;text-align:center;box-shadow:0 8px 30px rgba(16,24,40,.06)}h1{font-size:20px;margin:0 0 10px}.muted{color:#667085;font-size:13px;line-height:1.6}</style></head>
<body><div class="box"><h1>딸깍 기록물관리</h1><div id="state" class="muted">보유기록물 관리 화면을 불러오고 있습니다.</div></div>
<script>(async()=>{const state=document.getElementById('state');try{const src='../../site-src/holdings-v0.1.source.html',r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error(src+' · HTTP '+r.status);const html=await r.text();if(!html.includes("const APP_VERSION='v0.8.0 Beta'")||!html.includes('보유기록물 관리'))throw new Error('배포 파일 검증에 실패했습니다.');document.open();document.write(html);document.close()}catch(e){state.innerHTML='<b>화면을 불러오지 못했습니다.</b><br>'+String(e.message||e)}}</script></body></html>
